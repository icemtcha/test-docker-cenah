services:
  web:
    build: .
    container_name: kelontong_web
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT}:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: main_db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    networks:
      - shared

networks:
  shared:
    external: true
    name: shared_net